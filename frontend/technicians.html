<!doctype html><html lang="en">
<head>
  <meta charset="utf-8"><title>Technicians</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/style.css" rel="stylesheet">
</head><body>
<nav class="navbar fixed-top navbar-light bg-light shadow-sm px-3">
  <a class="navbar-brand fw-bold" href="index.html">← Dashboard</a>
  <span class="ms-2">Technicians / WIP</span>
</nav>

<main class="container" id="techCards"></main>

<script type="module">
  import {getJSON, $} from "./assets/api.js";

  const rows = await getJSON("/technicians");
  const byTech = {};
  rows.forEach(r=>{
    const t = r.technician || "Unassigned";
    byTech[t] = byTech[t] || [];
    byTech[t].push(r);
  });

  const root = $("#techCards");
  Object.entries(byTech).forEach(([tech,states])=>{
    root.insertAdjacentHTML("beforeend", `
      <div class="card mt-4">
        <div class="card-body">
          <h5 class="mb-3">${tech}</h5>
          <table class="table table-sm">
            <tbody>
              ${states.map(s=>`
                <tr><td>${s.state}</td><td class="text-end">${s.cnt}</td></tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      </div>`);
  });
</script>
</body></html>
