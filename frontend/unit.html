<!doctype html><html lang="en">
<head>
  <meta charset="utf-8"><title>Unit timeline</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/style.css" rel="stylesheet">
</head><body>
<nav class="navbar fixed-top navbar-light bg-light shadow-sm px-3">
  <a class="navbar-brand fw-bold" href="javascript:history.back()">← Back</a>
  <span id="title" class="ms-2"></span>
</nav>

<main class="container">
  <div class="card mt-4">
    <div class="card-body">
      <canvas id="bar" height="90"></canvas>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script type="module">
  import {getJSON, $} from "./assets/api.js";

  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  $("#title").textContent = `Unit ${id} – Timeline`;

  const rows = await getJSON(`/units/${id}/durations`);

  new Chart($("#bar"), {
    type:"bar",
    data:{
      labels: rows.map(r=>r.state_name),
      datasets:[{ label:"minutes", data: rows.map(r=>+r.minutes_spent)}]
    },
    options:{
      responsive:true, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}}
    }
  });
</script></body></html>
