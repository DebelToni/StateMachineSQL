<!doctype html><html lang="en">
<head>
  <meta charset="utf-8" /><title>Repair Shop – Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/style.css" rel="stylesheet">
</head><body>
<!-- ───────────────────────── NAV ────────────────────────── -->
<nav class="navbar fixed-top navbar-light bg-light shadow-sm px-3">
  <a class="navbar-brand fw-bold" href="#">Repair Shop</a>
  <div class="ms-auto">
    <a class="btn btn-link" href="index.html">Dashboard</a>
    <a class="btn btn-link" href="technicians.html">Technicians</a>
    <a class="btn btn-link" href="sla.html">SLA Breaches</a>
  </div>
</nav>

<!-- ───────────────────── Content container ──────────────── -->
<main class="container">

  <div id="stats" class="row g-3"></div>

  <div class="card mt-4">
    <div class="card-body">
      <h5>Throughput (last 30 days)</h5>
      <canvas id="tpChart" height="80"></canvas>
    </div>
  </div>

  <div class="card mt-4">
    <div class="card-body">
      <h5>Top Transitions</h5>
      <div class="table-responsive" style="max-height:18rem;">
        <table class="table table-sm">
          <thead><tr><th>From</th><th>Signal</th><th>To</th><th>Count</th></tr></thead>
          <tbody id="heatRows"></tbody>
        </table>
      </div>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script type="module">
  import {getJSON, fillTable, $} from "./assets/api.js";

  /* === Fetch all three endpoints in parallel === */
  const [units, tp30, heat] = await Promise.all([
    getJSON("/units"),
    getJSON("/throughput?days=30"),
    getJSON("/heatmap"),
  ]);

  /* -------- summary cards -------- */
  const total = units.length;
  const finished = units.filter(u => u.current_state === "reported").length;
  const wip  = total - finished;
  const transitions = heat.length;

  const metrics = [
    {label:"Total Units",      val: total},
    {label:"Work in Progress", val: wip},
    {label:"Completed",        val: finished},
    {label:"Transitions",      val: transitions},
  ];

  const statRow = $("#stats");
  metrics.forEach(m => {
    statRow.insertAdjacentHTML("beforeend", `
      <div class="col-6 col-lg-3">
        <div class="card text-center h-100">
          <div class="card-body d-flex flex-column justify-content-center">
            <h5>${m.label}</h5>
            <div class="display-6 fw-bold">${m.val}</div>
          </div>
        </div>
      </div>`);
  });

  /* -------- throughput chart -------- */
  const ctx = $("#tpChart");
  new Chart(ctx, {
    type: "bar",
    data: {
      labels: tp30.map(d => d.day.slice(5)),          // mm-dd
      datasets: [
        { label:"OK",    data: tp30.map(d=>d.ok_jobs)    },
        { label:"Fail",  data: tp30.map(d=>d.failed_jobs)}
      ]
    },
    options: {
      plugins:{legend:{position:"bottom"}}, 
      responsive:true, scales:{y:{beginAtZero:true}}
    }
  });

  /* -------- heatmap table -------- */
  fillTable($("#heatRows"), heat.slice(0,20),
    ["from_state","signal_name","to_state","cnt"]);
</script>
</body></html>
