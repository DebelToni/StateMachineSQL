<!doctype html><html lang="en">
<head>
  <meta charset="utf-8"><title>SLA Breaches</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/style.css" rel="stylesheet">
</head><body>
<nav class="navbar fixed-top navbar-light bg-light shadow-sm px-3">
  <a class="navbar-brand fw-bold" href="index.html">← Dashboard</a>
  <span class="ms-2">SLA Breaches</span>
</nav>

<main class="container">
  <div class="card mt-4">
    <div class="card-body">
      <h5>Units currently breaching SLA</h5>
      <div class="table-responsive">
        <table class="table table-sm">
          <thead>
            <tr><th>Unit</th><th>State</th><th class="text-end">Hours</th></tr>
          </thead><tbody id="slaRows"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script type="module">
  import {getJSON, fillTable,$} from "./assets/api.js";
  const rows = await getJSON("/sla-breaches");
  fillTable($("#slaRows"), rows, ["unit_name","state_name","hours_in_state"]);
  // make unit name clickable
  $("#slaRows").addEventListener("click", e=>{
    const tr = e.target.closest("tr");
    if (!tr) return;
    const idx = [...tr.parentNode.children].indexOf(tr);
    const id = rows[idx].id;
    location.href = `unit.html?id=${id}`;
  });
</script></body></html>
